services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: danangrealestate-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:8081
      # SQL Server chạy trên Windows host: đặt DB_SERVER=host.docker.internal trong backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4000"
    networks:
      - danangrealestate-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: danangrealestate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - danangrealestate-net

networks:
  danangrealestate-net:
    driver: bridge
